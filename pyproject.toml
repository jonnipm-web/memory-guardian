[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-guardian"
version = "0.1.0"
description = "Safe memory monitoring and diagnostics for Windows"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Memory Guardian Contributors" }]
keywords = [
    "memory", "monitoring", "windows", "psutil",
    "automation", "diagnostics", "claude-code",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9",
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-PyYAML",
]

[project.scripts]
memory-guardian = "memory_guardian.cli.main:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/memory-guardian"
Repository = "https://github.com/YOUR_USERNAME/memory-guardian"
Issues = "https://github.com/YOUR_USERNAME/memory-guardian/issues"
Changelog = "https://github.com/YOUR_USERNAME/memory-guardian/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_guardian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
